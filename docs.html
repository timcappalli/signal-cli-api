<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal CLI REST API - OpenAPI Documentation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --panel-bg: #0b1120;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --get: #3b82f6;
      --post: #10b981;
      --put: #f59e0b;
      --delete: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 32px 16px; }
    .container { max-width: 960px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .header-info { min-width: 0; flex: 1; }
    .header-info p { color: var(--text-muted); font-size: 14px; margin-top: 6px; max-width: 640px; line-height: 1.45; }
    h1 { font-size: 24px; }
    .nav { display: flex; align-items: center; gap: 16px; flex-shrink: 0; white-space: nowrap; padding-top: 4px; }
    .nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; }
    .nav a:hover { color: var(--text); }
    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .nav { padding-top: 0; }
    }

    .auth-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 20px; }
    .auth-bar-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .auth-bar-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .auth-status { font-size: 12px; color: var(--text-muted); }
    .auth-status.active { color: #34d399; }
    .auth-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .auth-controls input { flex: 1; min-width: 240px; }
    .auth-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

    input[type="text"], input[type="password"], input[type="number"], select, textarea {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { font-family: monospace; resize: vertical; min-height: 72px; }

    button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 500; transition: opacity 0.15s, background 0.15s; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #475569; }

    .endpoint { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .ep-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .method { font-family: monospace; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; color: #fff; flex-shrink: 0; }
    .method-get { background: var(--get); }
    .method-post { background: var(--post); }
    .method-put { background: var(--put); }
    .method-delete { background: var(--delete); }
    .path { font-family: monospace; font-size: 15px; font-weight: 600; }
    .summary { font-size: 14px; color: var(--text-muted); margin-left: auto; }
    .ep-actions { display: flex; align-items: center; gap: 8px; }
    .desc { font-size: 13px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

    .try-panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: none; }
    .try-panel.open { display: block; }
    .try-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 12px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .field-req { color: #f87171; }
    .field-check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); margin-top: 6px; cursor: pointer; }
    .field-check input { width: auto; }
    .try-footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .resp-box { margin-top: 12px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: none; }
    .resp-box.open { display: block; }
    .resp-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 8px; }
    .status-pill { font-family: monospace; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .status-ok { background: #10b98125; color: #34d399; }
    .status-err { background: #ef444425; color: #f87171; }

    details.schema-details { margin-top: 10px; }
    details.schema-details summary { font-size: 12px; color: var(--text-muted); cursor: pointer; user-select: none; }
    pre { background: #090d16; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 8px; overflow-x: auto; font-family: monospace; font-size: 12px; color: #cbd5e1; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-info">
        <h1 id="api-title">Signal CLI REST API</h1>
        <p id="api-desc"></p>
      </div>
      <div class="nav">
        <a href="/admin">Admin</a>
        <a href="/openapi.json">Raw OpenAPI JSON</a>
      </div>
    </header>

    <section class="auth-bar" aria-label="API Authorization">
      <div class="auth-bar-top">
        <div class="auth-bar-title">
          <span>API Explorer Authorization</span>
        </div>
        <span id="auth-status" class="auth-status">No key set (memory-only)</span>
      </div>
      <div class="auth-controls">
        <input
          type="password"
          id="apiKeyInput"
          placeholder="Paste scoped client API key (sig_...) from /admin — not API_KEY_MGMT"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="toggleKeyVisBtn" class="btn-secondary">Show</button>
        <button type="button" id="clearKeyBtn" class="btn-secondary">Clear</button>
      </div>
      <div class="auth-hint">
        Held only in page memory (never saved to localStorage/sessionStorage or URLs) and sent via the <code>Authorization: Bearer</code> header.
      </div>
    </section>

    <div id="endpoints"></div>
  </div>
  <script src="/docs.js"></script>
</body>
</html>
