<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal CLI REST API - OpenAPI Documentation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --get: #3b82f6;
      --post: #10b981;
      --delete: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 32px 16px; }
    .container { max-width: 960px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 24px; }
    .nav a { color: var(--text-muted); text-decoration: none; margin-left: 16px; font-size: 14px; }
    .nav a:hover { color: var(--text); }
    .endpoint { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .ep-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .method { font-family: monospace; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; color: #fff; }
    .method-get { background: var(--get); }
    .method-post { background: var(--post); }
    .method-delete { background: var(--delete); }
    .path { font-family: monospace; font-size: 15px; font-weight: 600; }
    .summary { font-size: 14px; color: var(--text-muted); margin-left: auto; }
    .desc { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
    pre { background: #090d16; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 10px; overflow-x: auto; font-family: monospace; font-size: 12px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="api-title">Signal CLI REST API</h1>
        <p id="api-desc" style="color: var(--text-muted); font-size: 14px; margin-top: 4px;"></p>
      </div>
      <div class="nav">
        <a href="/admin">Admin</a>
        <a href="/openapi.json">Raw OpenAPI JSON</a>
      </div>
    </header>
    <div id="endpoints"></div>
  </div>
  <script src="/docs.js"></script>
</body>
</html>
